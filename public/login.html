<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Log in · Social Poster</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/login.js"></script>
  </head>
  <body>
    <div class="login-wrap">
      <section class="card login-card">
        <h1>Social Poster</h1>
        <p class="muted">Enter the password set in <code>APP_PASSWORD</code>.</p>
        <form id="login-form">
          <input id="password" type="password" autocomplete="current-password" placeholder="Password" required autofocus />
          <button class="btn primary" type="submit">Log in</button>
          <div id="login-error" class="login-error" role="alert"></div>
        </form>
      </section>
    </div>
  </body>
</html>
